<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phish-Detect | Cyber-Ops Command Center</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050801;
            --neon-cyan: #00f2ff;
            --pulse-red: #ff003c;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --neon-border: 1px solid rgba(0, 242, 255, 0.3);
            --danger-border: 1px solid rgba(255, 0, 60, 0.3);
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Floating HUD Classes - Removed backgrounds/borders per user request */
        .glass-card {
            position: relative;
            background: transparent;
            border: none;
            border-radius: 0;
            padding: 2.5rem;
            box-shadow: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }

        #binary-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            opacity: 0.15;
            pointer-events: none;
        }

        /* Navbar Styling */
        .navbar {
            border-bottom: var(--neon-border);
            background: rgba(5, 8, 1, 0.9);
            backdrop-filter: blur(10px);
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #00ff00;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 10px #00ff00;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }

            100% {
                opacity: 1;
            }
        }

        /* Hero Styling */
        .hero-section {
            padding: 100px 0;
            text-align: center;
        }

        .cyber-input-group {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        .cyber-input {
            background: rgba(0, 0, 0, 0.5);
            border: var(--neon-border);
            color: var(--neon-cyan);
            padding: 1.5rem;
            font-size: 1.25rem;
            border-radius: 8px !important;
            transition: all 0.3s ease;
        }

        .cyber-input:focus {
            background: rgba(0, 242, 255, 0.05);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
            color: #fff;
            outline: none;
        }

        .scan-btn {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 1rem 3rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 2rem;
            position: relative;
            overflow: hidden;
            transition: 0.3s;
        }

        .scan-btn:hover {
            background: var(--neon-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 30px var(--neon-cyan);
        }

        /* Glitch Animation for Button */
        .glitch-hover:hover::before {
            content: 'SCANNING...';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--pulse-red);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: glitch 0.2s infinite;
        }

        @keyframes glitch {
            0% {
                transform: translate(2px, 2px);
            }

            50% {
                transform: translate(-2px, -2px);
            }

            100% {
                transform: translate(0);
            }
        }

        /* Overlay Styling */
        #scan-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 8, 1, 0.95);
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .loader-text {
            color: var(--neon-cyan);
            font-size: 1.5rem;
            margin-bottom: 2rem;
            height: 2rem;
        }

        .progress {
            width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
        }

        .progress-bar {
            background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        /* Dashboard Styling */
        #results-dashboard {
            display: none;
            padding-bottom: 100px;
        }

        .risk-meter-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto;
        }

        .risk-svg {
            transform: rotate(-90deg);
        }

        .risk-circle-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.1);
            stroke-width: 10;
        }

        .risk-circle-fill {
            fill: none;
            stroke: var(--neon-cyan);
            stroke-width: 10;
            stroke-dasharray: 565;
            stroke-dashoffset: 565;
            transition: stroke-dashoffset 2s ease-out;
            stroke-linecap: round;
        }

        .risk-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            font-weight: bold;
        }

        .log-container {
            max-height: 400px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            padding: 1rem;
            font-size: 0.9rem;
        }

        .log-entry {
            margin-bottom: 0.5rem;
            border-left: 2px solid var(--neon-cyan);
            padding-left: 10px;
        }

        .verdict-card {
            text-align: center;
        }

        .badge-verdict {
            font-size: 2rem;
            padding: 1rem 2rem;
            display: inline-block;
            margin-top: 1rem;
            animation: blink 1s infinite;
            letter-spacing: 4px;
        }

        @keyframes blink {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }

        .malicious {
            color: var(--pulse-red);
            border: 1px solid var(--pulse-red);
            box-shadow: 0 0 20px var(--pulse-red);
        }

        .secure {
            color: #00ff00;
            border: 1px solid #00ff00;
            box-shadow: 0 0 20px #00ff00;
        }

        .feature-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .feature-label {
            font-size: 0.8rem;
            opacity: 0.7;
            letter-spacing: 1px;
        }

        .feature-value {
            color: var(--neon-cyan);
            font-weight: 500;
        }

        /* 1. Dynamic Binary Background (Managed via JS Canvas) */
        body::before {
            display: none;
        }

        /* 2. HUD Corner Brackets */
        .glass-card {
            position: relative;
        }

        .glass-card span.bracket-tl,
        .glass-card span.bracket-tr,
        .glass-card span.bracket-bl,
        .glass-card span.bracket-br {
            content: "";
            position: absolute;
            width: 15px;
            height: 15px;
            border: 2px solid rgba(0, 242, 255, 0.4);
            pointer-events: none;
        }

        .bracket-tl {
            top: -2px;
            left: -2px;
            border-right: 0 !important;
            border-bottom: 0 !important;
        }

        .bracket-tr {
            top: -2px;
            right: -2px;
            border-left: 0 !important;
            border-bottom: 0 !important;
        }

        .bracket-bl {
            bottom: -2px;
            left: -2px;
            border-right: 0 !important;
            border-top: 0 !important;
        }

        .bracket-br {
            bottom: -2px;
            right: -2px;
            border-left: 0 !important;
            border-top: 0 !important;
        }

        /* 3. Active Scanning Beam */
        .scanning-beam-container {
            position: relative;
            overflow: hidden;
        }

        .scanning-beam {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
            box-shadow: 0 0 15px var(--neon-cyan);
            animation: scan-move 4s linear infinite;
            z-index: 10;
            display: none;
        }

        @keyframes scan-move {
            0% {
                top: -5%;
            }

            100% {
                top: 105%;
            }
        }

        /* 4. Telemetry Noise Removed */

        /* 5. Typewriter Effect Styles */
        .typewriter-text {
            display: inline;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 14px;
            background-color: var(--neon-cyan);
            margin-left: 5px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        /* Existing Reset Button Styles Re-integrated */
        .reset-container {
            display: flex;
            justify-content: center;
            margin-top: 3rem;
            width: 100%;
        }

        .reset-btn-prime {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.5);
            padding: 0.8rem 2.5rem;
            border-radius: 50px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .reset-btn-prime:hover {
            background: #fff;
            color: #000;
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
            border-color: #fff;
        }

        .reset-btn-prime i {
            transition: transform 0.6s ease;
        }

        .reset-btn-prime:hover i {
            transform: rotate(180deg);
        }

        .fade-out {
            opacity: 0;
            transition: opacity 0.5s ease;
        }
    </style>
</head>

<body>

    <!-- Dynamic Binary Background Canvas -->
    <canvas id="binary-bg"></canvas>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand text-white fw-bold" href="#">
                <i class="fa-solid fa-shield-halved me-2" style="color: var(--neon-cyan);"></i>PHISH-DETECT
            </a>
            <div class="ms-auto d-flex align-items-center">
                <span class="status-indicator"></span>
                <span class="small opacity-75">OPENPHISH SYNC: <span style="color: #00ff00;">ACTIVE</span></span>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="container">
            <h1 class="display-3 fw-bold mb-4">AI-Powered Phishing Detection System</h1>

            <div class="cyber-input-group">
                <input type="text" id="url-input" class="form-control cyber-input"
                    placeholder="ENTER TARGET URL (e.g. https://example.com)...">
                <button class="btn scan-btn glitch-hover" id="scan-trigger">Execute Scan</button>
            </div>
        </div>
    </section>

    <!-- Scan Overlay -->
    <div id="scan-overlay">
        <div class="loader-text" id="loader-msg">Initializing Core...</div>
        <div class="progress">
            <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%">
            </div>
        </div>
    </div>

    <!-- Results Dashboard -->
    <div id="results-dashboard" class="container" style="max-width: 1200px; margin: 0 auto;">
        <div class="row g-5">
            <!-- Left Side: URL Metadata -->
            <div class="col-lg-7">
                <div class="glass-card h-100 scanning-beam-container" id="metadata-card">
                    <span class="bracket-tl"></span><span class="bracket-tr"></span><span
                        class="bracket-bl"></span><span class="bracket-br"></span>
                    <div class="scanning-beam" id="scan-laser"></div>
                    <h5 class="mb-4 text-uppercase border-bottom border-white border-opacity-10 pb-3">
                        <i class="fa-solid fa-list-check me-2 text-info"></i>URL Metadata Analysis
                    </h5>
                    <div id="feature-list" class="d-flex flex-column gap-2">
                        <!-- Features injected here via JS (stacked vertically) -->
                    </div>
                </div>
            </div>

            <!-- Right Side: Verdict, Probability, and Logs -->
            <div class="col-lg-5">
                <!-- 1. Final Verdict -->
                <div
                    class="glass-card mb-4 verdict-card text-center d-flex flex-column justify-content-center align-items-center py-4">
                    <span class="bracket-tl"></span><span class="bracket-tr"></span><span
                        class="bracket-bl"></span><span class="bracket-br"></span>
                    <h5 class="mb-3 text-uppercase font-size-sm opacity-75">Final OSINT Verdict</h5>
                    <div id="verdict-icon" class="mb-3">
                        <i class="fa-solid fa-circle-check fa-4x" style="color: #00ff00;"></i>
                    </div>
                    <div id="verdict-status" class="badge-verdict secure">SECURE</div>
                    <p class="mt-3 mb-0 small opacity-75" id="verdict-source">Source: AI Neural Network</p>
                </div>

                <!-- 2. Threat Probability -->
                <div class="glass-card mb-4 text-center py-4">
                    <span class="bracket-tl"></span><span class="bracket-tr"></span><span
                        class="bracket-bl"></span><span class="bracket-br"></span>
                    <h5 class="mb-4 text-uppercase font-size-sm opacity-75">Threat Probability</h5>
                    <div class="risk-meter-container mx-auto"
                        style="transform: scale(0.8); margin-top: -20px; margin-bottom: -20px;">
                        <svg class="risk-svg" width="200" height="200">
                            <circle class="risk-circle-bg" cx="100" cy="100" r="90"></circle>
                            <circle id="risk-fill" class="risk-circle-fill" cx="100" cy="100" r="90"></circle>
                        </svg>
                        <div class="risk-value" id="risk-percent">0%</div>
                    </div>
                    <p class="mt-2 mb-0 opacity-50 small">Neural Confidence Score</p>
                </div>

                <!-- 3. Technical Summary Log -->
                <div class="glass-card">
                    <span class="bracket-tl"></span><span class="bracket-tr"></span><span
                        class="bracket-bl"></span><span class="bracket-br"></span>
                    <h5 class="mb-3 text-uppercase font-size-sm opacity-75">Technical Summary Log</h5>
                    <div class="log-container" id="analysis-log" style="max-height: 250px; overflow-y: auto;">
                        <div class="log-entry">Waiting for input...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Centered Reset Button at the bottom -->
        <div class="reset-container">
            <button class="reset-btn-prime" onclick="systemReset()">
                <i class="fa-solid fa-rotate-right"></i>
                Reset System Analysis
            </button>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const scanBtn = document.getElementById('scan-trigger');
        const urlInput = document.getElementById('url-input');
        const overlay = document.getElementById('scan-overlay');
        const loaderMsg = document.getElementById('loader-msg');
        const progressBar = document.querySelector('.progress-bar');
        const resultsDashboard = document.getElementById('results-dashboard');

        const messages = [
            'Querying Live Intelligence...',
            'Extracting URL Features...',
            'Checking SSL Certificates...',
            'Analyzing Domain Reputation...',
            'Running Neural Network Inference...',
            'Compiling Verdict...'
        ];

        scanBtn.addEventListener('click', async () => {
            const url = urlInput.value.trim();
            if (!url) return alert('Please enter a valid URL');

            // Show Overlay
            overlay.style.display = 'flex';
            resultsDashboard.style.display = 'none';

            // Simulate Scan Steps
            for (let i = 0; i < messages.length; i++) {
                loaderMsg.innerText = messages[i];
                let progress = ((i + 1) / messages.length) * 100;
                progressBar.style.width = progress + '%';
                await new Promise(r => setTimeout(r, 600));
            }

            // Call Backend
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                const data = await response.json();

                if (data.error) throw new Error(data.error);

                updateUI(data);
            } catch (err) {
                alert('Scan Failed: ' + err.message);
                overlay.style.display = 'none';
            }
        });

        function updateUI(data) {
            overlay.style.display = 'none';
            resultsDashboard.style.display = 'block';

            // Update Risk Meter using threat_probability
            const threatProb = ('threat_probability' in data) ? data.threat_probability : data.confidence;
            const riskPercent = Math.round(threatProb * 100);
            const offset = 565 - (565 * threatProb);
            const riskFill = document.getElementById('risk-fill');
            const riskLabel = document.getElementById('risk-percent');

            riskFill.style.strokeDashoffset = offset;
            riskLabel.innerText = riskPercent + '%';

            // Color coding based on status
            if (data.status === 'malicious') {
                riskFill.style.stroke = 'var(--pulse-red)';
                riskLabel.style.color = 'var(--pulse-red)';
            } else if (data.status === 'suspicious') {
                riskFill.style.stroke = '#ffaa00';
                riskLabel.style.color = '#ffaa00';
            } else {
                riskFill.style.stroke = '#00ff00';
                riskLabel.style.color = '#00ff00';
            }

            // Update Features
            const featureList = document.getElementById('feature-list');
            featureList.innerHTML = '';
            for (const [key, value] of Object.entries(data.features)) {
                const isAgeFeature = key === 'domain_age_days';
                const displayValue = isAgeFeature && typeof value === 'number'
                    ? `${value} days (${Math.round(value / 365)} years)`
                    : value;

                featureList.innerHTML += `
                    <div class="feature-item">
                        <span class="feature-label">${key.replace(/_/g, ' ').toUpperCase()}</span>
                        <span class="feature-value" ${isAgeFeature ? 'style="color: var(--neon-cyan); font-weight: bold;"' : ''}>${displayValue}</span>
                    </div>
                `;
            }

            // Start Active Scanning Beam
            const laser = document.getElementById('scan-laser');
            laser.style.display = 'block';

            // Update Log with Typewriter Effect
            const logElement = document.getElementById('analysis-log');
            const detectionMethod = data.detection_method || data.source;
            const logEntries = [
                `Detection Method: ${detectionMethod}`,
                `URL Parsed: ${data.features.tld} domain detected.`,
                `Threat Probability: ${riskPercent}%`,
                `Verdict: ${data.verdict || data.status.toUpperCase()}`,
                `Heuristics: ${data.status === 'malicious' ? 'Anomalies found.' : data.status === 'suspicious' ? 'Uncertain patterns detected.' : 'Standard patterns observed.'}`
            ];

            logElement.innerHTML = '';

            async function typeWriter(entries) {
                for (const text of entries) {
                    const entryDiv = document.createElement('div');
                    entryDiv.className = 'log-entry';
                    logElement.appendChild(entryDiv);

                    const textSpan = document.createElement('span');
                    textSpan.className = 'typewriter-text';
                    entryDiv.appendChild(textSpan);

                    const cursor = document.createElement('span');
                    cursor.className = 'cursor';
                    entryDiv.appendChild(cursor);

                    for (let i = 0; i < text.length; i++) {
                        textSpan.textContent += text.charAt(i);
                        await new Promise(r => setTimeout(r, 20));
                    }
                    cursor.remove();
                }
            }
            typeWriter(logEntries);

            // Update Verdict Card
            const verdictStatus = document.getElementById('verdict-status');
            const verdictIcon = document.getElementById('verdict-icon');
            const verdictSource = document.getElementById('verdict-source');

            verdictStatus.innerText = data.verdict || data.status.toUpperCase();
            verdictSource.innerText = 'Source: ' + detectionMethod;

            if (data.status === 'malicious') {
                verdictStatus.className = 'badge-verdict malicious';
                verdictIcon.innerHTML = '<i class="fa-solid fa-triangle-exclamation fa-4x" style="color: var(--pulse-red);"></i>';
            } else if (data.status === 'suspicious') {
                verdictStatus.className = 'badge-verdict';
                verdictStatus.style.color = '#ffaa00';
                verdictStatus.style.borderColor = '#ffaa00';
                verdictStatus.style.boxShadow = '0 0 20px #ffaa00';
                verdictIcon.innerHTML = '<i class="fa-solid fa-exclamation-circle fa-4x" style="color: #ffaa00;"></i>';
            } else {
                verdictStatus.className = 'badge-verdict secure';
                verdictIcon.innerHTML = '<i class="fa-solid fa-circle-check fa-4x" style="color: #00ff00;"></i>';
            }

            resultsDashboard.scrollIntoView({ behavior: 'smooth' });
        }

        function systemReset() {
            const dashboard = document.getElementById('results-dashboard');
            dashboard.classList.add('fade-out');
            setTimeout(() => {
                location.reload();
            }, 500);
        }

        // --- Binary Rain Background Script ---
        const canvas = document.getElementById('binary-bg');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const binaryChars = "01";
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];

        for (let x = 0; x < columns; x++) {
            drops[x] = 1;
        }

        function drawBinary() {
            ctx.fillStyle = "rgba(5, 8, 1, 0.1)"; // Match --bg-dark with alpha for trail
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "rgba(0, 242, 255, 0.5)"; // Subtle neon-cyan
            ctx.font = fontSize + "px 'JetBrains Mono'";

            for (let i = 0; i < drops.length; i++) {
                const text = binaryChars.charAt(Math.floor(Math.random() * binaryChars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawBinary, 50);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>

</html>
