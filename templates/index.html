<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Phishing Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h2>🔐 AI Phishing Detector</h2>
        <form method="POST">
            <input type="text" name="url" placeholder="Enter URL to check..." required>
            <br>
            <button type="submit">Check</button>
        </form>

        {% if result %}
        <div class="result-box {{ 'safe-box' if result == 'Safe' else 'phishing-box' }}">
            <h3>{{ '✅ Safe to visit!' if result == 'Safe' else '⚠️ Phishing Detected!' }}</h3>
        </div>        
        {% endif %}
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
<footer>
    <p>© 2025 <span style="font-weight:300;">Powered by <strong>LASA</strong></span></p>
</footer>
</html>
